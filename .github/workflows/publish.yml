name: Publish to npm

# 每次 push 一个 v* 标签时自动发布到 npm。
# 前置条件：在仓库 Settings → Secrets and variables → Actions 里新建名为
# NPM_TOKEN 的 secret，值为 npm 的 Automation Token（发布用，能绕过 2FA）。
# token 只存在 GitHub Secrets 里，不进代码、不进对话。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # 防止「tag 版本」与「package.json version」不一致时发布错版本。
      # 历史教训：曾出现 tag=v1.3.17 但 package.json 仍是 1.3.16。
      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag ($TAG) does not match package.json version ($PKG). Bump package.json before tagging."
            exit 1
          fi

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
